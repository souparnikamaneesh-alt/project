<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="dark-theme">
  <!-- Decorative Background Glows -->
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>
  <div class="ambient-glow glow-3"></div>

  <main class="calculator-wrapper">
    <div class="calculator-card" id="calculator">
      
      <!-- Top Action Bar -->
      <header class="calc-header">
        <div class="brand">
          <span class="status-dot"></span>
          <span class="brand-name">CALC</span>
        </div>
        <div class="header-actions">
          <button id="soundToggle" class="icon-btn" title="Toggle Sound Feedback" aria-label="Toggle Sound">
            <svg class="icon icon-sound-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
            </svg>
            <svg class="icon icon-sound-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <line x1="23" y1="9" x2="17" y2="15"></line>
              <line x1="17" y1="9" x2="23" y2="15"></line>
            </svg>
          </button>
          
          <button id="historyToggle" class="icon-btn" title="Calculation History" aria-label="View History">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
          </button>

          <button id="themeToggle" class="icon-btn" title="Toggle Light/Dark Theme" aria-label="Toggle Theme">
            <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>
        </div>
      </header>

      <!-- History Dropdown Panel -->
      <section id="historyDrawer" class="history-drawer" aria-label="History">
        <div class="history-header">
          <span>Recent Calculations</span>
          <button id="clearHistoryBtn" class="clear-history-btn">Clear</button>
        </div>
        <div id="historyList" class="history-list">
          <div class="history-empty">No calculations yet</div>
        </div>
      </section>

      <!-- Display Section -->
      <section class="display-container" id="displayContainer" title="Click to copy result">
        <div class="previous-operand" id="previousOperand"></div>
        <div class="current-operand-wrapper">
          <div class="current-operand" id="currentOperand">0</div>
        </div>
        <span class="copy-badge" id="copyBadge">Copied!</span>
      </section>

      <!-- Keypad Grid -->
      <section class="keypad" id="keypad">
        <!-- Row 1 -->
        <button class="key key-action" data-action="all-clear" data-key="Escape">AC</button>
        <button class="key key-action" data-action="delete" data-key="Backspace" title="Backspace">
          <svg class="key-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
            <line x1="18" y1="9" x2="12" y2="15"></line>
            <line x1="12" y1="9" x2="18" y2="15"></line>
          </svg>
        </button>
        <button class="key key-action" data-action="percent" data-key="%">%</button>
        <button class="key key-op" data-operator="÷" data-key="/">÷</button>

        <!-- Row 2 -->
        <button class="key key-num" data-number="7" data-key="7">7</button>
        <button class="key key-num" data-number="8" data-key="8">8</button>
        <button class="key key-num" data-number="9" data-key="9">9</button>
        <button class="key key-op" data-operator="×" data-key="*">×</button>

        <!-- Row 3 -->
        <button class="key key-num" data-number="4" data-key="4">4</button>
        <button class="key key-num" data-number="5" data-key="5">5</button>
        <button class="key key-num" data-number="6" data-key="6">6</button>
        <button class="key key-op" data-operator="−" data-key="-">−</button>

        <!-- Row 4 -->
        <button class="key key-num" data-number="1" data-key="1">1</button>
        <button class="key key-num" data-number="2" data-key="2">2</button>
        <button class="key key-num" data-number="3" data-key="3">3</button>
        <button class="key key-op" data-operator="+" data-key="+">+</button>

        <!-- Row 5 -->
        <button class="key key-action" data-action="negate">±</button>
        <button class="key key-num" data-number="0" data-key="0">0</button>
        <button class="key key-num" data-number="." data-key=".">.</button>
        <button class="key key-equals" data-action="equals" data-key="Enter">=</button>
      </section>

      <!-- Footer / Keyboard hint -->
      <footer class="calc-footer">
        <span>Keyboard friendly &bull; Press keys or click</span>
      </footer>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
